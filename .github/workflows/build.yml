name: Build Arrow Escape APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          if [ -f "arrow-puzzle.zip" ]; then
            unzip -o arrow-puzzle.zip -d .
          elif [ -f "arrow-escape.zip" ]; then
            unzip -o arrow-escape.zip -d .
          else
            unzip -o *.zip -d . || true
          fi

      - name: Set up Python for Icon Generation and Manifest Update
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Icons and Update AndroidManifest automatically
        run: |
          python -c "
          import os
          from PIL import Image
          import xml.etree.ElementTree as ET
          
          # ১. লোগো রিসাইজ করে mipmap ফোল্ডারে বসানো
          if os.path.exists('1788532247419.png'):
              img = Image.open('1788532247419.png').convert('RGBA')
              sizes = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192,
              }
              base_dir = 'app/src/main/res'
              for folder, size in sizes.items():
                  dir_path = os.path.join(base_dir, folder)
                  os.makedirs(dir_path, exist_ok=True)
                  resized = img.resize((size, size), Image.Resampling.LANCZOS)
                  resized.save(os.path.join(dir_path, 'ic_launcher.png'))
                  resized.save(os.path.join(dir_path, 'ic_launcher_round.png'))
              print('Icons generated successfully!')
          else:
              print('Logo file not found, skipping icon generation.')

          # ২. AndroidManifest.xml ফাইলে icon ও roundIcon যুক্ত করা
          manifest_path = 'app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
              tree = ET.parse(manifest_path)
              root = tree.getroot()
              application = root.find('application')
              if application is not None:
                  android_ns = '{http://schemas.android.com/apk/res/android}'
                  application.set(android_ns + 'icon', '@mipmap/ic_launcher')
                  application.set(android_ns + 'roundIcon', '@mipmap/ic_launcher_round')
                  tree.write(manifest_path, encoding='utf-8', xml_declaration=True)
                  print('AndroidManifest.xml updated with icons successfully!')
          else:
              print('AndroidManifest.xml not found.')
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install required Android SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arrow-escape-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
